name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # 배포 주소 단일 소스 — sitemap / robots / prerender 가 모두 참조합니다.
  # 커스텀 도메인으로 옮길 때는 SITE_ORIGIN 을 바꾸고 VITE_BASE_PATH 를 / 로 되돌린 뒤
  # public/CNAME 을 다시 추가하세요.
  SITE_ORIGIN: https://rosieoh.github.io
  VITE_BASE_PATH: /BetweenTheLines/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # sitemap 생성 → vite build → 라우트별 정적 HTML 프리렌더(404.html 포함)
      - name: Build site
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

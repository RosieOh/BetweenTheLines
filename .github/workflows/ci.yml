name: CI

# 배포 워크플로(deploy-pages.yml)는 main 푸시에서만 돌기 때문에,
# PR 단계에서 검증이 비는 것을 막기 위한 워크플로입니다.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SITE_ORIGIN: https://rosieoh.github.io
      VITE_BASE_PATH: /BetweenTheLines/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # 프리렌더까지 포함한 전체 파이프라인이 깨지지 않는지 확인합니다.
      - name: Build
        run: npm run build

      - name: 프리렌더 산출물 검증
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          count=$(find dist/post -name index.html | wc -l)
          echo "프리렌더된 포스트: $count개"
          test "$count" -gt 0
